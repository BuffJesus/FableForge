name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-numpy

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The offline part of tools/check_all.py: everything that does not need a
      # Fable install. The retail smoke, scratch-install suites and the in-game
      # harness run locally against a real install.
      - name: Unit tests
        run: ./build/fableforge_tests.exe

      - name: LZO1X vs minilzo
        run: ./build/fableforge_lzo_tests.exe

      - name: GUI without an install (D3D11 WARP)
        run: ./build/FableForge.exe --auto tests/ui/noinstall.txt --install "D:/definitely/not/fable"

      - name: GUI run log
        if: always()
        run: cat tests/ui/noinstall.txt.log || echo "(no log written)"

      - name: CLI usage
        run: ./build/forge.exe || true

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/package.py --no-check

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: FableForge-win64
          path: dist/*.zip
